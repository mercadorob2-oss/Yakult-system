<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Illustrative suspicious email">
<rect width="960" height="540" fill="#f1f5f9"/><rect x="55" y="45" width="850" height="450" rx="20" fill="#fff"/>
<rect x="55" y="45" width="850" height="64" rx="20" fill="#14263c"/><text x="85" y="85" fill="#fff" font-family="Segoe UI,Arial" font-size="23">Email safety · DEMO EXAMPLE</text>
<text x="90" y="159" fill="#172b42" font-family="Segoe UI,Arial" font-size="25" font-weight="700">Urgent: confirm your account today</text>
<rect x="80" y="185" width="800" height="55" rx="8" fill="#fff0f1"/><text x="98" y="219" fill="#a81926" font-family="Segoe UI,Arial" font-size="22">From: helpdesk@unfamiliar-domain.example</text>
<text x="90" y="283" fill="#526276" font-family="Segoe UI,Arial" font-size="22">“Approve this request immediately to avoid interruption.”</text>
<rect x="90" y="317" width="330" height="54" rx="8" fill="#bd1825"/><text x="110" y="352" fill="#fff" font-family="Segoe UI,Arial" font-size="20">Unfamiliar verification link</text>
<text x="90" y="422" fill="#172b42" font-family="Segoe UI,Arial" font-size="21">Check the sender. Question urgency. Verify the destination.</text>
<text x="90" y="461" fill="#65758a" font-family="Segoe UI,Arial" font-size="17">Fictional example. No live links or employee information.</text></svg>
